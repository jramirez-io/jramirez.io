<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Ramirez — Cloud & Systems Architect</title>
    <style>
        :root {
            --bg: #19181a;
            --card: #222125;
            --text: #fcfcfa;
            --accent: #a9dc76;
            --sub: #78dce8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 { margin: 0 0 0.5rem 0; font-size: 2rem; color: var(--accent); }
        h2 { font-size: 1.1rem; color: var(--sub); font-weight: 400; margin-bottom: 1.5rem; }
        p { line-height: 1.6; color: #c1c0c0; }
        .links { margin-top: 2rem; }
        .links a {
            color: var(--accent);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
        }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Jose Ramirez</h1>
        <h2>Cloud & Systems Architect</h2>
        <p>Specialist in high-availability infrastructure, Anycast routing, and enterprise-grade distributed systems architecture.</p>
        <div class="links">
            <a href="mailto:jose@jramirez.io">Contact</a>
            <a href="https://github.com/jramirez-io" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
